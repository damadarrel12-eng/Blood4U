version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0

  # Google Maps
  google_maps_flutter: ^2.6.0

  # UI
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.2
  image_picker: ^1.0.7
  firebase_messaging: ^16.1.3
  geocoding: ^4.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true